name: Post-Operative Escalation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r post_op_escalation/requirements.txt

      - name: Verify Dataset Generation
        working-directory: ./post_op_escalation
        run: |
          python -m data.generate_data

      - name: Run Default Test Suite (PostgreSQL-Independent)
        working-directory: ./post_op_escalation
        run: |
          python -m pytest backend/tests/ -v

      - name: Run Evaluation Pipeline & Verify Artifacts
        working-directory: ./post_op_escalation
        run: |
          python -m notebooks.run_evaluation
